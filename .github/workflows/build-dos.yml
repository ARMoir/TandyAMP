name: TandyAMP DOS 8086 build and MIDI tests
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'tools/**'
      - 'docs/**'
      - 'LICENSE'
      - '.github/workflows/build-dos.yml'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write   # publish and prune only TandyAMP build releases
  actions: write    # prune previous CI build artifacts

# Multiple pushes must never race while publishing/cleaning releases.
concurrency:
  group: tandyamp-release-main
  cancel-in-progress: false

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Generate original MIDI tests
        run: python3 tests/make_test_mid.py
      - name: Compile and test MIDI engine on host
        run: |
          gcc -std=c89 -O2 -Wall -Wextra -pedantic -o tests/midi_test tests/midi_test.c src/midi.c
          ./tests/midi_test tests/test0.mid tests/test1.mid tests/bad.mid tests/dense.mid tests/large.mid tests/legacy16.mid tests/melody16.mid
      - name: Verify 320x200 controls and dirty redraw budgets
        run: |
          gcc -std=c89 -O2 -Wall -Wextra -pedantic -o tests/ui_test tests/ui_test.c src/midi.c
          ./tests/ui_test
      - name: Verify musical event ordering and voice allocation
        run: |
          gcc -std=c89 -O2 -Wall -Wextra -pedantic -o tests/playback_test tests/playback_test.c src/midi.c
          ./tests/playback_test
          gcc -std=c89 -O2 -Wall -Wextra -pedantic -o tests/mixer_test tests/mixer_test.c
          ./tests/mixer_test
      - name: Set up Open Watcom for 16-bit DOS
        uses: open-watcom/setup-watcom@v1
        with:
          version: '2.0'
          target: dos
      - name: Compile native 8086 DOS executable
        run: |
          wcl -bt=dos -0 -ms -os -s -zq -fe=TANDYAMP.EXE src/main.c src/midi.c
          test -s TANDYAMP.EXE
          file TANDYAMP.EXE
      - name: Generate original three-voice MIDI demo
        run: python3 tools/make_demo.py
      - name: Package DOS runtime files only
        run: |
          mkdir -p dist
          cp TANDYAMP.EXE DEMO.MID LICENSE dist/
      - name: Create lightweight DOS ZIP
        run: |
          cd dist
          zip -9 "TandyAMP-DOS-build-${GITHUB_RUN_NUMBER}.zip" \
            TANDYAMP.EXE DEMO.MID LICENSE
          # Documentation is in GitHub source only. No Markdown files in the DOS ZIP.
          if unzip -Z1 "TandyAMP-DOS-build-${GITHUB_RUN_NUMBER}.zip" | grep -i "[.]md"; then
            echo "ERROR: Markdown file included in DOS release"
            exit 1
          fi
          test "$(unzip -Z1 "TandyAMP-DOS-build-${GITHUB_RUN_NUMBER}.zip" | wc -l)" -eq 3
      - name: Upload current build artifact
        uses: actions/upload-artifact@v4
        with:
          name: TandyAMP-DOS-build-${{ github.run_number }}
          path: dist/TandyAMP-DOS-build-${{ github.run_number }}.zip
          retention-days: 60
          if-no-files-found: error
      - name: Publish latest successful DOS build as GitHub Release
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="tandyamp-build-${GITHUB_RUN_NUMBER}"
          bundle="dist/TandyAMP-DOS-build-${GITHUB_RUN_NUMBER}.zip"
          test -s "$bundle"
          gh release create "$tag" "$bundle" dist/TANDYAMP.EXE dist/DEMO.MID \
            --target "$GITHUB_SHA" \
            --title "TandyAMP DOS Build #${GITHUB_RUN_NUMBER}" \
            --notes "Automatic 16-bit DOS build from commit ${GITHUB_SHA}. Includes TANDYAMP.EXE, original DEMO.MID and LICENSE (no Markdown files). Compiled with Open Watcom and passed MIDI regression tests. Real Tandy 1000 EX playback is not yet hardware-verified." \
            --latest
          # Do NOT remove earlier builds unless this release is readable and has assets.
          gh release view "$tag" --json tagName,isDraft,assets \
            --jq 'select(.isDraft == false and (.assets | length) >= 3) | .tagName' \
            | grep -Fx "$tag"
      - name: Delete older TandyAMP releases and CI build artifacts
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="tandyamp-build-${GITHUB_RUN_NUMBER}"
          # Safeguard against accidental deletion if publication did not complete.
          gh release view "$tag" --json tagName,isDraft,assets \
            --jq 'select(.isDraft == false and (.assets | length) >= 3) | .tagName' \
            | grep -Fx "$tag"

          # Only releases created by this workflow's unique tag prefix.
          gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq '.[] | .tag_name | select(startswith("tandyamp-build-"))' \
            > "${RUNNER_TEMP}/tandyamp-release-tags.txt"
          while IFS= read -r old_tag; do
            [[ -z "$old_tag" || "$old_tag" == "$tag" ]] && continue
            echo "Deleting superseded release and tag: $old_tag"
            gh release delete "$old_tag" --yes --cleanup-tag
          done < "${RUNNER_TEMP}/tandyamp-release-tags.txt"

          # Retain only this run's ZIP; older TandyAMP-DOS-v0.1 artifacts
          # are also removed. Other workflows and unrelated artifacts are untouched.
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.name | startswith(\"TandyAMP-DOS-\")) | select(.workflow_run.id != ${GITHUB_RUN_ID}) | .id" \
            > "${RUNNER_TEMP}/tandyamp-old-artifact-ids.txt"
          while IFS= read -r old_id; do
            [[ -z "$old_id" ]] && continue
            echo "Deleting superseded Actions artifact ID: $old_id"
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/$old_id"
          done < "${RUNNER_TEMP}/tandyamp-old-artifact-ids.txt"

          echo "Published $tag; kept current build, removed older TandyAMP builds."

