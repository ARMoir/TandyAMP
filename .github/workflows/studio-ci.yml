name: TandyAMP Studio (Python)
on:
  push:
    branches: [main]
    paths:
      - 'tools/tandyamp_studio/**'
      - '.github/workflows/studio-ci.yml'
  pull_request:
    paths:
      - 'tools/tandyamp_studio/**'
      - '.github/workflows/studio-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight MIDI dependency
        run: python -m pip install 'mido>=1.3,<2'
      - name: Compile Studio scripts
        run: python -m compileall -q tools/tandyamp_studio
      - name: Test TandyAMP Studio MIDI optimization
        run: python -m unittest discover -s tools/tandyamp_studio/tests -v
      - name: Install offline stem-analysis dependencies
        run: python -m pip install 'numpy>=1.24,<3' 'scipy>=1.10,<2' 'soundfile>=0.12,<1'
      - name: Benchmark real stem pitch detector on known synthetic audio
        run: python tools/tandyamp_studio/benchmarks/autotune_stem_synthetic.py
      - name: Benchmark guide-free AutoTune riff continuity A/B
        run: python tools/tandyamp_studio/benchmarks/autotune_phrase_ab.py
